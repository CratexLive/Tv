<script>
  if (window.self === window.top) {
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
    document.addEventListener('keydown', function(e) {
      if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) {
        e.preventDefault(); window.location.href = "https://www.google.com"; return false;
      }
    });
    (function() {
      const threshold = 160;
      setInterval(function() {
        if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
          window.location.href = "https://www.google.com";
        }
      }, 1000);
      try {
        function checkDebugger() {
          const startTime = new Date().getTime();
          debugger; 
          const endTime = new Date().getTime();
          if (endTime - startTime > 100) { window.location.href = "https://www.google.com"; }
        }
        setInterval(checkDebugger, 2000);
      } catch(err) {}
    })();
  }
</script>

<link rel="preconnect" href="https://www.jiotv.com/">
<link rel="dns-prefetch" href="https://www.jiotv.com/">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css">
<style>
  :root {
    --bg-main: #FBF2DA;
    --accent-olive: #6A7357;
    --text-main: #1A1A1A;
    --text-muted: #555555;
    --white: #FFFFFF;
    --tg-blue: #0088CC;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg-main);
    overflow: hidden;
    font-family: 'Segoe UI', 'Inter', system-ui, Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    color: var(--text-main);
  }
  #overlay {
    position: fixed; inset: 0;
    background: var(--bg-main);
    z-index: 9999; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    animation: fadeIn .3s ease-out;
  }
  #overlay svg { animation: spin 1s linear infinite; filter: drop-shadow(0 0 12px var(--tg-blue)); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  #overlay p { color: var(--text-muted); font-size: 13px; letter-spacing: 1px; font-weight: 500; }

  #channel-list {
    position: fixed; inset: 0;
    background: var(--bg-main);
    z-index: 9998; display: none; flex-direction: column; overflow-y: auto;
    padding: max(20px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)) 18px;
    scrollbar-width: thin; scrollbar-color: var(--tg-blue) #F3F4F6;
    animation: slideUp .4s cubic-bezier(.16,1,.3,1);
  }
  #ch-header {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 16px; padding-bottom: 18px; border-bottom: 1px solid rgba(0,136,204,0.25);
  }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tg-blue); box-shadow: 0 0 12px rgba(0,136,204,0.4); }
  #ch-header h1 { font-size: 18px; font-weight: 800; letter-spacing: 1.2px; color: var(--text-main); }
  .search-wrapper { position: relative; margin-bottom: 18px; width: 100%; max-width: 500px; margin-left: auto; margin-right: auto; }
  .search-wrapper input {
    width: 100%; padding: 14px 20px 14px 48px;
    background: var(--white); border: 2px solid rgba(0,136,204,0.25);
    border-radius: 60px; font-size: 15px; color: var(--text-main); outline: none; transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.04);
  }
  .search-wrapper input:focus { border-color: var(--tg-blue); box-shadow: 0 0 0 4px rgba(0,136,204,0.12); }
  .search-wrapper svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: var(--tg-blue); opacity: 0.8; pointer-events: none; }

  #ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .ch-card {
    background: var(--white);
    border: 1px solid rgba(0,136,204,0.12); border-radius: 16px;
    padding: 16px 12px 14px; cursor: pointer; text-decoration: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 12px; transition: transform .25s cubic-bezier(.2,0,0,1), background .25s, border-color .25s, box-shadow .25s; min-height: 145px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.04);
  }
  .ch-card:hover { border-color: var(--tg-blue); transform: translateY(-4px) scale(1.02); box-shadow: 0 10px 25px rgba(0,136,204,0.15); }
  .ch-card:active { transform: scale(.95); }
  .ch-card span { color: var(--text-main); font-size: 12.5px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-height: 36px; width: 100%; }
  .ch-logo { width: 100%; max-width: 88px; height: 50px; object-fit: contain; border-radius: 8px; }
  .ch-logo-fallback {
    width: 88px; height: 50px; border-radius: 10px; background: #F3F4F6;
    border: 1.5px solid rgba(0,136,204,0.25); display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; color: var(--tg-blue);
  }
  .no-results { grid-column: 1/-1; text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 15px; background: var(--white); border-radius: 18px; box-shadow: 0 6px 16px rgba(0,0,0,0.04); }

  #pc { position: fixed; inset: 0; background: #000000; display: none; align-items: center; justify-content: center; touch-action: manipulation; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000000; will-change: transform; }

  #status {
    position: fixed; top: max(14px, env(safe-area-inset-top)); right: 12%;
    transform: translateY(-10px); z-index: 9997; display: flex; align-items: center; gap: 7px;
    padding: 8px 18px; background: var(--white); border: 1px solid rgba(0,136,204,0.25);
    font-size: 12px; border-radius: 30px; opacity: 0; transition: opacity 0.3s; white-space: nowrap; pointer-events: none;
    box-shadow: 0 6px 16px rgba(0,0,0,0.04);
  }
  #status.show { opacity: 1; transform: translateY(0); }
  .st-dot { width: 8px; height: 8px; border-radius: 50%; }
  #status.ok { color: var(--text-main); } #status.ok .st-dot { background: var(--tg-blue); }
  #status.live { color: var(--text-main); } #status.live .st-dot { background: var(--tg-blue); }
  #status.warn { color: var(--text-main); } #status.warn .st-dot { background: var(--accent-olive); }
  #status.err { color: var(--text-main); } #status.err .st-dot { background: var(--text-muted); }

  #tgBadge {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
    z-index: 10001; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
    background: var(--tg-blue); color: #FFFFFF; font-size: 12px; font-weight: 600;
    text-decoration: none; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,136,204,0.25);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  #tgBadge:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 20px rgba(0,136,204,0.4); }
  #tgBadge svg { width: 14px; height: 14px; fill: #FFFFFF; }
</style>
</head>

  <div id="overlay">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="16" stroke="#F3F4F6" stroke-width="4"></circle>

  <div id="status"></div>
  <div id="channel-list">

      <h1>CricXCrate TV</h1>

    <div class="search-wrapper">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="channelSearch" placeholder="Search channels..." autocomplete="off" spellcheck="false">

  <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js"></script>
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"></script>
  <script>
    (function(){
      "use strict";

      var API_PRIMARY = "https://sonujson-v5.pages.dev/Data/sports.json";

      var $overlay = document.getElementById("overlay");
      var $loadMsg = document.getElementById("loadMsg");
      var $status  = document.getElementById("status");
      var $list    = document.getElementById("channel-list");
      var $grid    = document.getElementById("ch-grid");
      var $pc      = document.getElementById("pc");
      var $vid     = document.getElementById("v");
      var $search  = document.getElementById("channelSearch");
      var _stTmr   = null;
      var _allChannels = [];

      function toast(msg, type, dur){
        $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
        $status.className = "show " + (type || "ok");
        if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }
        if(dur !== 0){
          _stTmr = setTimeout(function(){
            $status.className = $status.className.replace("show","").trim();
            _stTmr = null;
          }, dur || 4000);
        }
      }

      function setMsg(m)    { if($loadMsg) $loadMsg.textContent = m; }
      function hideOverlay(){ if($overlay) $overlay.style.display = "none"; }
      function getChId()    { return new URLSearchParams(location.search).get("id") || ""; }
      function rawCookie(c) { return c && c.startsWith("__hdnea__=")? c.slice(10) : (c || ""); }

      async function loadData(){
        var r = await fetch(API_PRIMARY, { cache: "no-store" });
        if(!r.ok) throw new Error("HTTP " + r.status);
        var d = await r.json();
        var rawList = Array.isArray(d) ? d : (d.channels || []);
        var channels = rawList.map(function(ch, idx) {
          var kId = (ch.keyId || ch.key_id || '').toLowerCase();
          var k   = (ch.key || '').toLowerCase();
          var sonKeys = [];
          var son = ch.sonuxs;
          
          if (Array.isArray(son)) {
            for (var s = 0; s < son.length; s++) {
              if (son[s] && son[s].includes(':')) {
                var parts = son[s].split(':');
                sonKeys.push({
                  key_id: parts[0].trim().toLowerCase(),
                  key: parts[1].trim().toLowerCase()
                });
              }
            }
          }

          return {
            id: ch.id || ch.channel_id || String(idx),
            name: ch.name || ch.title || 'Unnamed',
            stream_url: ch.streamUrl || ch.mpd_url || ch.stream_url || ch.url || '',
            logo: ch.logo || ch.logo_url || ch.image || '',
            key_id: kId,
            key: k,
            sonuxs: sonKeys,
            cookie: ch.cookie || '',
            category: ch.group || ch.category || 'General'
          };
        }).filter(function(ch) { return ch.stream_url; });
        if(!channels.length) throw new Error("No channels found");
        return { channels: channels };
      }

      function renderChannels(channels) {
        $grid.innerHTML = "";
        if (!channels || channels.length === 0) {
          $grid.innerHTML = '<div class="no-results">No channels found</div>';
          return;
        }

        var f = document.createDocumentFragment();
        channels.forEach(function(ch){
          var a = document.createElement("a");
          a.className = "ch-card";
          a.href = "?id=" + encodeURIComponent(ch.id);

          var initials = (ch.name || "TV").split(" ").slice(0,2).map(function(w){return w[0]||'';}).join('');
          if (ch.logo && ch.logo.trim()) {
            var img = document.createElement("img");
            img.className = "ch-logo";
            img.src = ch.logo;
            img.alt = ch.name;
            img.loading = "lazy";
            img.referrerPolicy = "no-referrer";
            img.onerror = function() {
              this.style.display = "none";
              var fallback = document.createElement("div");
              fallback.className = "ch-logo-fallback";
              fallback.textContent = initials;
              if (this.parentNode) this.parentNode.insertBefore(fallback, this);
            };
            a.appendChild(img);
          } else {
            var fallback = document.createElement("div");
            fallback.className = "ch-logo-fallback";
            fallback.textContent = initials;
            a.appendChild(fallback);
          }

          var span = document.createElement("span");
          span.textContent = ch.name;
          a.appendChild(span);
          f.appendChild(a);
        });

        $grid.appendChild(f);
      }

      function filterChannels(query) {
        if (!query || !query.trim()) {
          renderChannels(_allChannels);
          return;
        }
        var q = query.trim().toLowerCase();
        var filtered = _allChannels.filter(function(ch) {
          return (ch.name || "").toLowerCase().includes(q) || (ch.id || "").toLowerCase().includes(q);
        });
        renderChannels(filtered);
      }

      function renderList(channels){
        hideOverlay();
        _allChannels = channels;
        renderChannels(_allChannels);
        $list.style.display = "flex";
      }

      function errMsg(msg){
        setMsg(msg);
        if($overlay) $overlay.style.display = "flex";
        toast(msg, "err", 0);
      }

      async function startPlayer(ch){
        $pc.style.display = "flex";
        shaka.polyfill.installAll();
        if(!shaka.Player.isBrowserSupported()){ errMsg("Browser not supported."); return; }

        var cookieValue = ch.cookie || '';
        var player = window.player = new shaka.Player($vid);
        var ui = new shaka.ui.Overlay(player, $pc, $vid);

        var url = ch.stream_url;
        var raw = rawCookie(cookieValue);

        var clearKeys = {};
        if (ch.key_id && ch.key) {
          clearKeys[ch.key_id] = ch.key;
        }
        if (Array.isArray(ch.sonuxs)) {
          for (var i = 0; i < ch.sonuxs.length; i++) {
            if (ch.sonuxs[i].key_id && ch.sonuxs[i].key) {
              clearKeys[ch.sonuxs[i].key_id] = ch.sonuxs[i].key;
            }
          }
        }

        player.configure({
          manifest: {
            defaultPresentationDelay: 4,
            ignoreTextStreamFailures: true,
            retryParameters: {maxAttempts:5, baseDelay:500, backoffFactor:2, timeout:30000}
          },
          streaming: {
            lowLatencyMode: false,
            bufferingGoal: 12,
            rebufferingGoal: 1.5,
            bufferBehind: 30,
            safeSeekOffset: 4,
            stallEnabled: true
          },
          drm: { clearKeys: clearKeys }
        });

        var T = shaka.net.NetworkingEngine.RequestType;
        player.getNetworkingEngine().registerRequestFilter(function(type, req){
          req.headers["Referer"] = "https://www.jiotv.com/";
          req.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36";
          req.headers["Origin"] = "https://www.jiotv.com";
          if (cookieValue) req.headers["Cookie"] = cookieValue;
          if(type === T.MANIFEST || type === T.SEGMENT) {
            if (raw) {
              req.uris = req.uris.map(function(u){
                if (u.includes('__hdnea__')) return u;
                return u + (u.includes('?') ? '&' : '?') + '__hdnea__=' + raw;
              });
            }
          }
        });

        player.addEventListener("error", function(ev){
          toast("Stream error", "err", 6000);
        });

        try {
          setMsg("Loading stream…");
          toast("Loading…", "warn", 0);
          await player.load(url);
          hideOverlay();
          toast("● Live", "ok", 4000);
          $vid.play().catch(function(){});
        } catch(e) {
          hideOverlay();
          toast("Stream error", "err", 0);
        }
      }

      async function main(){
        var id = getChId(), data;
        try {
          setMsg("Fetching channels…");
          data = await loadData();
        } catch(_) {
          errMsg("Connection error.");
          return;
        }
        var channels = data.channels || data;
        if(!id){ renderList(channels); return; }
        var ch = channels.find(function(c){ return c.id === id; });
        if(!ch){ errMsg("Channel not found."); return; }
        document.title = ch.name + " · CricXCrate";
        await startPlayer(ch);
      }

      document.addEventListener("DOMContentLoaded", function() {
        if($search) {
          $search.addEventListener("input", function(e) {
            filterChannels(e.target.value);
          });
        }
        main();
      });
    })();
  </script>
</body>
